<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="pagina2.html">
        <p>Formulario de Registro de Reserva: </p>
        <label for="origen">Origen:</label>
        <input type="text" id="origen"  value="Córdoba" disabled>
        <br><br>
        <label for="Destino">Destino:</label>
        <input type="text" id="Destino" value="Tucumán" disabled>
        <br><br>
        <label for="Fecha">Fecha de vuelo</label>
        <input type="date" id="Fecha" disabled>
        <br><br>
        <label for="hora">Hora de vuelo</label>
        <input type="time" value="18:00" id="hora" disabled>
        <br><br>
        <label for="Clase">Clase:</label>
        <select name="Selección de Clase" id="Clase">
            <option value="Ejecutiva">Ejecutiva</option>
            <option value="Económica">Económica</option>
        </select>
        <br><br>
        <label for="CantidadPasajes">Cantidad de Pasajes</label>
        <input type="number" min="1" max="50" id="CantidadPasajes" required>
        <br><br>
        <label for="Ubicación">Selección de Ubicación:</label>
        <select name="Selección de Ubicación" id="Ubicación">
            <option value="Ventanilla">Ventanilla</option>
            <option value="Centro">Centro</option>
            <option value="Pasillo">Pasillo</option>
        </select>
        <br><br>
        <label for="Silla">Selección de Nro de Silla:</label>
        <input type="number" min="1" max="50" id="Silla">
        <br><br>
        <label for="Nombre">Apellido y Nombre:</label>
        <input type="text" maxlength="100" required id="Nombre"> 
        <br><br>
        <label for="DNI">DNI:</label>
        <input type="number" min="10000000" max="99999999" id="DNI" required>
        <br><br>
        <label for="Nacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="Nacimiento">
        <br><br>
        <label >Sexo:</label> <br>
        <input type="radio" id="M" name="sexo">
        <label for="M">M</label>
        <input type="radio" id="F" name="sexo">
        <label for="F">F</label>
        <br><br>
        <input type="reset" value="Cancelar">
        <input type="submit" value="Aceptar">

    </form>

    <footer>
        <p>"Sitio Oficial de Compañía Argentina-2025"</p>
    </footer>
</body>
</html>
