<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vuelos</title>
    <link rel="stylesheet" href="/practico2/static/css/pagina1.css">  
</head>
<body>
    <header>
        <div>
        <h1>Compañía Argentina</h1>
        <h2>Gestión de Vuelos</h2>
        <nav>
            <a href="#">Registrar usuario </a> 
            <a href="#">Consultar vuelos disponibles/reservar </a>
            <a href="reservas.html">Ver reservas realizadas </a>
            <a href="#">Eliminar reservas realizadas </a>
        </nav>
    </div>
    </header>
    
    <form action="pagina2.html" id="formVuelo">
        <div>
            <label for="origen">Selección de Origen:</label>
            <select name="Selección de Origen" id="origen">
                <option value="Córdoba">Córdoba</option>
                <option value="Mendoza">Mendoza</option>
                <option value="Tucumán">Tucumán</option>
            </select>
        </div>

        <div>
            <label for="Destino">Selección de Destino </label>
            <select name="Selección de Destino" id="destino">
                <option value="Córdoba">Córdoba</option>
                <option value="Mendoza">Mendoza</option>
                <option value="Tucumán">Tucumán</option>
            </select>
        </div>
        
        <div>
            <label for="Fechavuelo">Fecha de vuelo:</label>
            <input type="date" id="Fechavuelo">
        </div>
        <div>
            <input type="submit" value="Buscar">
            <input type="reset" value="Cancelar">
        </div>
    </form>
    <footer>
        <p>Sitio Oficial de Compañía Argentina-2025</p>
    </footer>
    <script src="/practico2/js/pagina1.js"></script>
</body>
</html>
