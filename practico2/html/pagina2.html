<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Vuelos</title>
    <link rel="stylesheet" href="/practico2/static/css/pagina1.css">
    <link rel="stylesheet" href="/practico2/static/css/pagina2.css">
</head>
<body>
    <header>
        <div>
        <h1>Compañía Argentina</h1>
        <h2>Gestión de Vuelos</h2>
        <nav>
            <a href="#">Registrar usuario </a> 
            <a href="#">Consultar vuelos disponibles/reservar </a>
            <a href="reservas.html">Ver reservas realizadas </a>
            <a href="#">Eliminar reservas realizadas </a>
        </nav>
    </div>
    </header>

    <form action="pagina2.html">
        <h2>Formulario de Registro de Reserva: </h2>
        
        <div>
            <label for="origen">Origen:</label>
            <input type="text" id="origen"  value="Córdoba" disabled>
        </div>

        <div>
            <label for="Destino">Destino:</label>
            <input type="text" id="Destino" value="Tucumán" disabled>
        </div>
        
        <div>
            <label for="Fecha">Fecha de vuelo</label>
            <input type="date" id="Fecha" disabled>
        </div>
        
        <div>
            <label for="hora">Hora de vuelo</label>
            <input type="time" value="18:00" id="hora" disabled>
        </div>
        
        <div>
            <label for="Clase">Clase:</label>
            <select id="Clase" required>
                <option value="">-- Seleccione --</option>
                <option value="Ejecutiva">Ejecutiva</option>
                <option value="Económica">Económica</option>
            </select>
        </div>
        
        <div>
            <label for="CantidadPasajes">Cantidad de Pasajes</label>
            <input type="number" min="1" max="50" id="CantidadPasajes" required>
        </div>

        <div id="contenedorPasajeros"></div>

        <div>
            <input type="reset" value="Cancelar">
            <input type="submit" value="Aceptar">
        </div>
    </form>

    <footer>
        <p>"Sitio Oficial de Compañía Argentina - 2025"</p>
    </footer>
    <script src="/practico2/js/pagina2.js"></script>

</body>
</html>
